name: Build Release APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        # fork PR 无 Secret → 静默跳过
        # 内部 PR/分支有 Secret → 解码 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/smsalert-release.jks
            echo "Keystore decoded from secrets"
          else
            echo "No keystore secret (fork PR or missing config), will build debug"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/smsalert-release.jks ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            ./gradlew :app:assembleRelease
          else
            ./gradlew :app:assembleDebug
          fi

      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "App version: $VERSION"
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            for apk in app/build/outputs/apk/release/*.apk; do
              [ -f "$apk" ] && mv "$apk" "$(dirname "$apk")/SmsAlertTool-${VERSION}-release.apk" && echo "→ SmsAlertTool-${VERSION}-release.apk"
            done
          elif ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            for apk in app/build/outputs/apk/debug/*.apk; do
              [ -f "$apk" ] && mv "$apk" "$(dirname "$apk")/SmsAlertTool-${VERSION}-debug.apk" && echo "→ SmsAlertTool-${VERSION}-debug.apk"
            done
          fi

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/ app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Compute artifact name
        id: artifact
        # PR ref_name 含 / (如 1/merge)，替换为 - 以符合 artifact 命名规范
        run: echo "name=SmsAlertTool-$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
