name: Build Release APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Sign Release APK (CI keystore)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing APK with CI keystore..."
            # Generate a temporary keystore (in production, store the real keystore in secrets)
            keytool -genkey -v -keystore ci-keystore.jks \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 365 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=SmsAlert CI, OU=CI, O=youngDoo, L=Unknown, ST=Unknown, C=CN"
            
            UNSIGNED_APK=$(ls app/build/outputs/apk/release/app-release-unsigned.apk 2>/dev/null || ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
            if [ -f "$UNSIGNED_APK" ]; then
              # Align and sign
              $ANDROID_SDK_ROOT/build-tools/*/zipalign -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
              $ANDROID_SDK_ROOT/build-tools/*/apksigner sign \
                --ks ci-keystore.jks \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" \
                --out app-release-signed.apk \
                app-release-aligned.apk
              mv app-release-signed.apk app/build/outputs/apk/release/
              echo "APK signed successfully"
            fi
          else
            echo "No signing secrets set — APK will be unsigned. Set KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD secrets for signed release."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsAlertTool-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: SmsAlertTool-${{ github.ref_name }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
