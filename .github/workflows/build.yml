name: Build Release APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/smsalert-release.jks
            echo "Keystore decoded from secrets"
          else
            echo "No keystore secret found"
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          # Get version from build.gradle
          VERSION=$(grep 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "App version: $VERSION"
          # Rename to SmsAlertTool-{version}-release.apk
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              dir=$(dirname "$apk")
              mv "$apk" "$dir/SmsAlertTool-${VERSION}-release.apk"
              echo "Renamed to SmsAlertTool-${VERSION}-release.apk"
            fi
          done

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          if command -v apksigner &>/dev/null; then
            apksigner verify app/build/outputs/apk/release/*.apk && echo "✓ Signature verified"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsAlertTool-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: SmsAlertTool-${{ github.ref_name }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
